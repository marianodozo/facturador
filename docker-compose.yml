services:
  db:
    image: postgres:16-alpine
    container_name: facturador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: facturador
      POSTGRES_PASSWORD: facturador
      POSTGRES_DB: facturador
    ports:
      - "5432:5432"
    volumes:
      - facturador-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturador"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  facturador-db:
