# Facturador ARCA — producción.
#
# La base no se expone y la app escucha sólo en loopback: queda detrás del
# Caddy que ya corre en la instancia para la app de rugby, que la alcanza por
# nombre de contenedor a través de la red compartida `proxy`.
#
# El servicio se llama `facturador` y no `app` a propósito: el compose del
# rugby ya tiene un servicio `app` y, al compartir red, los alias de Docker
# chocaban y el tráfico podía terminar en la aplicación equivocada.

services:
  db:
    image: postgres:16-alpine
    container_name: facturador-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: facturador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: facturador
    volumes:
      - facturador-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturador -d facturador"]
      interval: 10s
      timeout: 5s
      retries: 10

  facturador:
    build:
      context: .
      dockerfile: Dockerfile
    image: facturador:latest
    container_name: facturador
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://facturador:${POSTGRES_PASSWORD}@db:5432/facturador?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?falta AUTH_SECRET en el .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?falta ENCRYPTION_KEY en el .env}
      CRON_SECRET: ${CRON_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@empresa.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-cambiar123}
      TZ: America/Argentina/Buenos_Aires
      PORT: 8091
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - default
      - proxy

volumes:
  facturador-db:

networks:
  # Red del compose del rugby, donde vive Caddy. Se declara externa para no
  # crearla ni borrarla desde acá.
  proxy:
    external: true
    name: rugby-equipos_default
